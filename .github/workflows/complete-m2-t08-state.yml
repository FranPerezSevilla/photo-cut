name: Complete M2-T08 state

on:
  push:
    branches:
      - task/M2-T08-persistent-pdf-preview

permissions:
  contents: write

concurrency:
  group: complete-m2-t08-state
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task/M2-T08-persistent-pdf-preview
          fetch-depth: 0

      - name: Complete roadmap task
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path('project/plan.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          tasks = {task['id']: task for task in plan['tasks']}

          completed = tasks['M2-T08']
          if completed['status'] not in {'ready', 'done'}:
              raise SystemExit(f"Unexpected M2-T08 state: {completed['status']}")
          completed['status'] = 'done'
          completed['completedAt'] = '2026-09-07'
          completed['evidence'] = [
              'lib/features/print_job/step_one_pdf_preview.dart',
              'lib/features/print_job/zoomable_pdf_document_preview.dart',
              'lib/features/print_job/print_configuration_screen.dart',
              'test/features/print_job/persistent_pdf_preview_test.dart',
              'test/features/print_job/zoomable_pdf_document_preview_test.dart',
              'project/decisions/ADR-010-persistent-pdf-preview-state.md',
              'project/evidence/M2-T08/interaction.md',
              'project/evidence/M2-T08/README.md',
              'https://github.com/FranPerezSevilla/photo-cut/issues/14',
          ]
          completed['verification'] = [
              'GitHub Actions preparation run 34129229485: analysis and focused Step 1 tests — success',
              'GitHub Actions CI run 34129453514: Quality and Android — success',
              'GitHub Actions CI run 34129453514: iOS simulator build — success',
          ]

          next_task = tasks['M3-T01']
          if next_task['status'] == 'backlog':
              next_task['status'] = 'ready'
          elif next_task['status'] != 'ready':
              raise SystemExit(f"Unexpected M3-T01 state: {next_task['status']}")

          plan['currentMilestone'] = 'M3'
          plan['updatedAt'] = '2026-09-07'
          plan_path.write_text(
              json.dumps(plan, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          tests_path = Path('tool/tests/test_project_cli.py')
          tests = tests_path.read_text(encoding='utf-8')
          replacements = {
              'test_next_returns_persistent_preview_task': 'test_next_returns_calibration_task',
              "self.assertEqual(task['id'], 'M2-T08')": "self.assertEqual(task['id'], 'M3-T01')",
              "self.assertIn('M2 — Usable MVP flow', result.stdout)": "self.assertIn('M3 — Physical validation', result.stdout)",
              "self.assertIn('M2-T08', result.stdout)": "self.assertIn('M3-T01', result.stdout)",
          }
          for old, new in replacements.items():
              if old not in tests:
                  raise SystemExit(f'Missing expected CLI test text: {old}')
              tests = tests.replace(old, new)
          tests_path.write_text(tests, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_state = (
              'Photo Cut now explains every configuration control and lets the user frame\n'
              'crop-to-fill by moving the photo directly inside the target shape. The\n'
              'repository remains in **M2 — Usable MVP flow**; the next task adds a persistent\n'
              'one-tap PDF preview with zoom, pan and fit-page reset.\n'
          )
          new_state = (
              'Photo Cut now completes the usable MVP preparation flow with contextual help,\n'
              'visual framing and a persistent one-tap PDF preview with zoom, pan and\n'
              'fit-page reset. The repository is now in **M3 — Physical validation**; the\n'
              'next task adds the calibration sheet and actual-size print guidance.\n'
          )
          if old_state not in readme:
              raise SystemExit('README current-state paragraph did not match expected text')
          readme = readme.replace(old_state, new_state)
          readme = readme.replace('show M2-T08', 'show M3-T01')
          readme = readme.replace('verify M2-T08', 'verify M3-T01')
          readme_path.write_text(readme, encoding='utf-8')

          evidence_path = Path('project/evidence/M2-T08/README.md')
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text(
              '# M2-T08 evidence — persistent zoomable PDF preview\n\n'
              'Focused preparation run `34129229485` and complete Android/iOS PR CI run '
              '`34129453514` passed.\n\n'
              'Step 1 keeps a single print-job controller while exposing `Ajustes` and '
              '`Vista previa` as a persistent one-tap switch. The preview lazily builds '
              'the actual current PDF, invalidates stale documents after setting changes, '
              'and keeps zoom/pan/reset state entirely inside the viewer. No viewer '
              'transformation changes PDF bytes, layout geometry or physical dimensions.\n\n'
              'This automated evidence does not claim real-handset gesture quality; that '
              'remains a useful smoke test of the generated APK.\n',
              encoding='utf-8',
          )
          PY

      - name: Validate repository-owned state
        run: |
          python3 tool/project.py validate
          python3 -m unittest discover -s tool/tests -p 'test_*.py'
          python3 tool/project.py status
          python3 tool/project.py next

      - name: Commit completion and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/complete-m2-t08-state.yml
          git add project/plan.json tool/tests/test_project_cli.py README.md project/evidence/M2-T08/README.md
          git commit -m 'M2-T08: complete persistent preview and open calibration'
          git restore --worktree .
          git push origin HEAD:task/M2-T08-persistent-pdf-preview
