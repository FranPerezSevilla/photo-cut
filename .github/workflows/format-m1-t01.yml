name: Format M1-T01

on:
  push:
    branches:
      - task/M1-T01-physical-units

permissions:
  contents: write

concurrency:
  group: format-m1-t01
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task/M1-T01-physical-units
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Format task sources
        run: dart format lib/core/units test/core/units

      - name: Commit formatted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/units test/core/units
          if git diff --cached --quiet; then
            echo 'Files were already formatted.'
          else
            git commit -m 'M1-T01: format unit primitives'
            git push origin HEAD:task/M1-T01-physical-units
          fi
