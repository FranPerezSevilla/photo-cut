name: Prepare M2 T05

on:
  push:
    branches:
      - task/M2-T05-resolution-guidance

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: task/M2-T05-resolution-guidance
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Apply task patch
        run: python3 tool/apply_m2_t05.py

      - name: Resolve and format
        run: |
          flutter pub get
          dart format lib test

      - name: Verify focused task
        run: |
          flutter analyze --fatal-infos
          flutter test test/core/quality test/features/print_job/resolution_guidance_test.dart test/features/print_job/print_configuration_screen_test.dart

      - name: Commit prepared task
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git rm .github/workflows/prepare-m2-t05.yml
          git rm tool/apply_m2_t05.py
          git add lib test project/product.md project/architecture.md CHANGELOG.md
          git commit -m 'M2-T05: integrate effective resolution guidance'
          git push origin HEAD:task/M2-T05-resolution-guidance
