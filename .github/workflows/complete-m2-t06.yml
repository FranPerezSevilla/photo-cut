name: Complete M2 T06

on:
  push:
    branches:
      - task/M2-T06-contextual-help

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task/M2-T06-contextual-help
          fetch-depth: 0

      - name: Complete contextual-help task
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path('project/plan.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          tasks = {task['id']: task for task in plan['tasks']}

          completed = tasks['M2-T06']
          if completed['status'] not in {'ready', 'done'}:
              raise SystemExit(f"Unexpected M2-T06 state: {completed['status']}")
          completed['status'] = 'done'
          completed['completedAt'] = '2026-09-07'
          completed['evidence'] = [
              'lib/features/print_job/configuration_help.dart',
              'lib/features/print_job/print_configuration_screen.dart',
              'test/features/print_job/configuration_help_test.dart',
              'test/features/print_job/print_configuration_help_flow_test.dart',
              'project/evidence/M2-T06/README.md',
              'https://github.com/FranPerezSevilla/photo-cut/issues/14',
          ]
          completed['verification'] = [
              'GitHub Actions preparation run 34103512295: analysis and feature tests — success',
              'GitHub Actions CI run 34103900438: Quality and Android — success',
              'GitHub Actions CI run 34103900438: iOS simulator build — success',
          ]

          next_task = tasks['M2-T07']
          if next_task['status'] == 'backlog':
              next_task['status'] = 'ready'
          elif next_task['status'] != 'ready':
              raise SystemExit(f"Unexpected M2-T07 state: {next_task['status']}")

          plan['updatedAt'] = '2026-09-07'
          plan_path.write_text(
              json.dumps(plan, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          test_path = Path('tool/tests/test_project_cli.py')
          tests = test_path.read_text(encoding='utf-8')
          replacements = {
              'test_next_returns_contextual_help_task': 'test_next_returns_visual_framing_task',
              "self.assertEqual(task['id'], 'M2-T06')": "self.assertEqual(task['id'], 'M2-T07')",
              "self.assertIn('M2-T06', result.stdout)": "self.assertIn('M2-T07', result.stdout)",
          }
          for old, new in replacements.items():
              if old not in tests:
                  raise SystemExit(f'Missing expected CLI test text: {old}')
              tests = tests.replace(old, new)
          test_path.write_text(tests, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_state = (
              'Photo Cut completes the two-step prepare/review/print flow and now estimates\n'
              'effective print resolution without changing requested geometry. The repository\n'
              'remains in **M2 — Usable MVP flow**; real-device feedback is scheduled next as\n'
              'a focused UX pass for contextual help, visual framing and persistent zoomable preview.\n'
          )
          new_state = (
              'Photo Cut now explains every configuration control in-app and keeps margin,\n'
              'separation and cut marks behind Advanced options. The repository remains in\n'
              '**M2 — Usable MVP flow**; the next task replaces the abstract framing sliders\n'
              'with direct visual positioning of the photo.\n'
          )
          if old_state not in readme:
              raise SystemExit('README current-state paragraph did not match expected text')
          readme = readme.replace(old_state, new_state)
          readme = readme.replace('show M2-T06', 'show M2-T07')
          readme = readme.replace('verify M2-T06', 'verify M2-T07')
          readme_path.write_text(readme, encoding='utf-8')

          evidence_path = Path('project/evidence/M2-T06/README.md')
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text(
              '# M2-T06 evidence — contextual help and configuration hierarchy\n\n'
              'Photo Cut now exposes concise offline help for every configuration parameter requested in issue #14. Each help sheet explains what changes, when to use the setting, one example and whether the PDF itself changes.\n\n'
              'Margin, separation and cut marks moved to a collapsed Advanced options section while the existing defaults remain usable without opening it. The old framing sliders are clearer but intentionally remain temporary until M2-T07 replaces them with direct visual positioning.\n\n'
              'Preparation run `34103512295` and full PR CI run `34103900438` passed analysis, tests, Android builds and the iOS simulator build.\n',
              encoding='utf-8',
          )
          PY

      - name: Validate state
        run: |
          python3 tool/project.py validate
          python3 -m unittest discover -s tool/tests -p 'test_*.py'
          python3 tool/project.py next

      - name: Commit completion
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git rm .github/workflows/complete-m2-t06.yml
          git add project/plan.json tool/tests/test_project_cli.py README.md project/evidence/M2-T06/README.md
          git commit -m 'M2-T06: complete contextual help and open visual framing'
          git restore --worktree .
          git push origin HEAD:task/M2-T06-contextual-help
