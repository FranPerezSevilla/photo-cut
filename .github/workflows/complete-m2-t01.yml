name: Complete M2-T01

on:
  push:
    branches:
      - task/M2-T01-image-selection

permissions:
  contents: write

concurrency:
  group: complete-m2-t01
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task/M2-T01-image-selection
          fetch-depth: 0

      - name: Complete task and open configuration work
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path('project/plan.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          tasks = {task['id']: task for task in plan['tasks']}

          completed = tasks['M2-T01']
          if completed['status'] not in {'ready', 'done'}:
              raise SystemExit(f"Unexpected M2-T01 state: {completed['status']}")
          completed['status'] = 'done'
          completed['completedAt'] = '2026-09-04'
          completed['evidence'] = [
              'lib/platform/image_picker/',
              'lib/features/print_job/photo_selection_controller.dart',
              'lib/features/home/home_screen.dart',
              'test/platform/image_picker/image_picker_gateway_test.dart',
              'test/features/print_job/photo_selection_controller_test.dart',
              'test/app/photo_cut_app_test.dart',
              'project/decisions/ADR-007-gallery-image-selection.md',
              'ios/Runner/Info.plist',
              'project/evidence/M2-T01/README.md',
          ]
          completed['verification'] = [
              'GitHub Actions preparation run 33905836030: analysis and focused tests — success',
              'GitHub Actions CI run 33905993143: Quality and Android — success',
              'GitHub Actions CI run 33905993143: iOS simulator build — success',
          ]

          next_task = tasks['M2-T02']
          if next_task['status'] == 'backlog':
              next_task['status'] = 'ready'
          elif next_task['status'] != 'ready':
              raise SystemExit(f"Unexpected M2-T02 state: {next_task['status']}")

          plan['updatedAt'] = '2026-09-04'
          plan_path.write_text(
              json.dumps(plan, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          tests_path = Path('tool/tests/test_project_cli.py')
          tests = tests_path.read_text(encoding='utf-8')
          replacements = {
              'test_next_returns_image_selection_task': 'test_next_returns_print_configuration_task',
              "self.assertEqual(task['id'], 'M2-T01')": "self.assertEqual(task['id'], 'M2-T02')",
              "self.assertIn('M2-T01', result.stdout)": "self.assertIn('M2-T02', result.stdout)",
          }
          for old, new in replacements.items():
              if old not in tests:
                  raise SystemExit(f'Missing expected CLI test text: {old}')
              tests = tests.replace(old, new)
          tests_path.write_text(tests, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_state = (
              'The geometry and PDF spike is complete: exact-size PDFs can be generated,\n'
              'previewed, shared and handed to native printing. The repository is now in\n'
              '**M2 — Usable MVP flow**; the next task selects a real gallery image robustly.\n'
          )
          new_state = (
              'Photo Cut can now select and preview one real gallery image while keeping it\n'
              'local to the device and recovering Android lost-data cases. The repository\n'
              'remains in **M2 — Usable MVP flow**; the next task builds the app-owned\n'
              'configuration screen for the two-step prepare-then-print flow.\n'
          )
          if old_state not in readme:
              raise SystemExit('README current-state paragraph did not match expected text')
          readme = readme.replace(old_state, new_state)
          readme = readme.replace('show M2-T01', 'show M2-T02')
          readme = readme.replace('verify M2-T01', 'verify M2-T02')
          readme_path.write_text(readme, encoding='utf-8')

          evidence_path = Path('project/evidence/M2-T01/README.md')
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text(
              '# M2-T01 evidence — robust gallery image selection\n\n'
              'The implementation passed focused preparation run `33905836030` and '\
              'complete Android/iOS PR CI run `33905993143`.\n\n'
              'The feature uses an app-owned gateway, treats cancellation as a normal '\
              'result, checks Android lost data once at startup, copies image bytes into '\
              'short-lived state, discards provider paths and declares the iOS photo '\
              'library purpose. Tests use only synthetic bytes and fake gateways.\n\n'
              'This evidence proves application behaviour and target compilation. A '\
              'real-device picker smoke test remains useful but is not represented as '\
              'having happened here.\n',
              encoding='utf-8',
          )
          PY

      - name: Validate repository-owned state
        run: |
          python3 tool/project.py validate
          python3 -m unittest discover -s tool/tests -p 'test_*.py'
          python3 tool/project.py status
          python3 tool/project.py next

      - name: Commit task completion and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/complete-m2-t01.yml
          git add project/plan.json tool/tests/test_project_cli.py README.md project/evidence/M2-T01/README.md
          git commit -m 'M2-T01: complete image selection and open configuration flow'
          git pull --rebase origin task/M2-T01-image-selection
          git push origin HEAD:task/M2-T01-image-selection
