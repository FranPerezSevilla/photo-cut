name: Format M2-T04

on:
  push:
    branches:
      - task/M2-T04-final-review-print-handoff

permissions:
  contents: write

concurrency:
  group: format-m2-t04
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task/M2-T04-final-review-print-handoff
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Format M2-T04 sources
        run: |
          dart format \
            lib/features/home/home_screen.dart \
            lib/features/print_job/print_job_filename_builder.dart \
            lib/features/print_job/print_review_screen.dart \
            test/features/print_job/print_job_document_factory_test.dart \
            test/features/print_job/print_review_screen_test.dart \
            test/integration/print_job_flow_test.dart \
            test/platform/pdf/cut_marks_test.dart

      - name: Commit formatted sources and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-m2-t04.yml
          git add \
            lib/features/home/home_screen.dart \
            lib/features/print_job/print_job_filename_builder.dart \
            lib/features/print_job/print_review_screen.dart \
            test/features/print_job/print_job_document_factory_test.dart \
            test/features/print_job/print_review_screen_test.dart \
            test/integration/print_job_flow_test.dart \
            test/platform/pdf/cut_marks_test.dart
          git commit -m 'M2-T04: format final review implementation'
          git pull --rebase origin task/M2-T04-final-review-print-handoff
          git push origin HEAD:task/M2-T04-final-review-print-handoff
