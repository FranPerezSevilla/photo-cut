name: Complete M2 T07

on:
  push:
    branches:
      - task/M2-T07-visual-framing

permissions:
  contents: write

concurrency:
  group: complete-m2-t07
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task/M2-T07-visual-framing
          fetch-depth: 0

      - name: Complete visual-framing task
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path('project/plan.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          tasks = {task['id']: task for task in plan['tasks']}

          completed = tasks['M2-T07']
          if completed['status'] not in {'ready', 'done'}:
              raise SystemExit(f"Unexpected M2-T07 state: {completed['status']}")
          completed['status'] = 'done'
          completed['completedAt'] = '2026-09-07'
          completed['evidence'] = [
              'lib/core/crop/visual_framing_mapper.dart',
              'lib/features/print_job/visual_framing_editor.dart',
              'lib/features/print_job/print_configuration_controller.dart',
              'lib/features/print_job/print_configuration_screen.dart',
              'test/core/crop/visual_framing_mapper_test.dart',
              'test/features/print_job/visual_framing_editor_test.dart',
              'test/features/print_job/visual_framing_controller_test.dart',
              'test/app/photo_cut_app_test.dart',
              'project/evidence/M2-T07/interaction.md',
              'project/evidence/M2-T07/README.md',
              'https://github.com/FranPerezSevilla/photo-cut/issues/14',
          ]
          completed['verification'] = [
              'GitHub Actions preparation run 34125704380: analysis and focused crop/print-job tests — success',
              'GitHub Actions CI run 34126333498: Quality and Android — success',
              'GitHub Actions CI run 34126333498: iOS simulator build — success',
          ]

          next_task = tasks['M2-T08']
          if next_task['status'] == 'backlog':
              next_task['status'] = 'ready'
          elif next_task['status'] != 'ready':
              raise SystemExit(f"Unexpected M2-T08 state: {next_task['status']}")

          plan['updatedAt'] = '2026-09-07'
          plan_path.write_text(
              json.dumps(plan, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          tests_path = Path('tool/tests/test_project_cli.py')
          tests = tests_path.read_text(encoding='utf-8')
          replacements = {
              'test_next_returns_visual_framing_task': 'test_next_returns_persistent_preview_task',
              "self.assertEqual(task['id'], 'M2-T07')": "self.assertEqual(task['id'], 'M2-T08')",
              "self.assertIn('M2-T07', result.stdout)": "self.assertIn('M2-T08', result.stdout)",
          }
          for old, new in replacements.items():
              if old not in tests:
                  raise SystemExit(f'Missing expected CLI test text: {old}')
              tests = tests.replace(old, new)
          tests_path.write_text(tests, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_state = (
              'Photo Cut now explains every configuration control in-app and keeps margin,\n'
              'separation and cut marks behind Advanced options. The repository remains in\n'
              '**M2 — Usable MVP flow**; the next task replaces the abstract framing sliders\n'
              'with direct visual positioning of the photo.\n'
          )
          new_state = (
              'Photo Cut now explains every configuration control and lets the user frame\n'
              'crop-to-fill by moving the photo directly inside the target shape. The\n'
              'repository remains in **M2 — Usable MVP flow**; the next task adds a persistent\n'
              'one-tap PDF preview with zoom, pan and fit-page reset.\n'
          )
          if old_state not in readme:
              raise SystemExit('README current-state paragraph did not match expected text')
          readme = readme.replace(old_state, new_state)
          readme = readme.replace('show M2-T07', 'show M2-T08')
          readme = readme.replace('verify M2-T07', 'verify M2-T08')
          readme_path.write_text(readme, encoding='utf-8')

          evidence_path = Path('project/evidence/M2-T07/README.md')
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text(
              '# M2-T07 evidence — direct visual framing\n\n'
              'Preparation run `34125704380` and full PR CI run `34126333498` passed after '
              'the responsive framing controls and the app smoke test were updated.\n\n'
              'The two abstract framing sliders are no longer the primary interaction. In '
              '`Rellenar`, the user moves the photograph itself inside the exact target '
              'aspect; the drag updates the existing normalized `focus` value and therefore '
              'the same `CropPlanner` state used by final PDF generation. Wide images move '
              'horizontally and tall images vertically. `Encajar` visibly shows the complete '
              'image and disables crop movement.\n\n'
              'Switching between fit modes preserves normalized focus, while `Centrar` and '
              'double-tap reset it. No second crop model or freeform editor was introduced.\n\n'
              'Issue #14 remains open because M2-T08 still needs to add persistent one-tap '
              '`Ajustes | Vista previa` navigation and viewer-only zoom/pan/reset.\n',
              encoding='utf-8',
          )
          PY

      - name: Validate state
        run: |
          python3 tool/project.py validate
          python3 -m unittest discover -s tool/tests -p 'test_*.py'
          python3 tool/project.py status
          python3 tool/project.py next

      - name: Commit completion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/complete-m2-t07.yml
          git add project/plan.json tool/tests/test_project_cli.py README.md project/evidence/M2-T07/README.md
          git commit -m 'M2-T07: complete visual framing and open persistent preview'
          git restore --worktree .
          git pull --rebase origin task/M2-T07-visual-framing
          git push origin HEAD:task/M2-T07-visual-framing
