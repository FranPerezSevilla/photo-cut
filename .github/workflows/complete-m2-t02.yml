name: Complete M2-T02

on:
  push:
    branches:
      - task/M2-T02-print-configuration

permissions:
  contents: write

concurrency:
  group: complete-m2-t02
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task/M2-T02-print-configuration
          fetch-depth: 0

      - name: Complete task and open crop work
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path('project/plan.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          tasks = {task['id']: task for task in plan['tasks']}

          completed = tasks['M2-T02']
          if completed['status'] not in {'ready', 'done'}:
              raise SystemExit(f"Unexpected M2-T02 state: {completed['status']}")
          completed['status'] = 'done'
          completed['completedAt'] = '2026-09-04'
          completed['evidence'] = [
              'lib/features/print_job/length_unit.dart',
              'lib/features/print_job/print_job_configuration.dart',
              'lib/features/print_job/print_configuration_state.dart',
              'lib/features/print_job/print_configuration_controller.dart',
              'lib/features/print_job/print_configuration_screen.dart',
              'test/features/print_job/print_configuration_controller_test.dart',
              'test/features/print_job/print_configuration_screen_test.dart',
              'project/evidence/M2-T02/README.md',
              'project/evidence/M2-T02/two-step-flow.md',
          ]
          completed['verification'] = [
              'GitHub Actions preparation run 33908511625: analysis and focused tests — success',
              'GitHub Actions CI run 33908672038: Quality and Android — success',
              'GitHub Actions CI run 33908672038: iOS simulator build — success',
          ]

          next_task = tasks['M2-T03']
          if next_task['status'] == 'backlog':
              next_task['status'] = 'ready'
          elif next_task['status'] != 'ready':
              raise SystemExit(f"Unexpected M2-T03 state: {next_task['status']}")

          plan['updatedAt'] = '2026-09-04'
          plan_path.write_text(
              json.dumps(plan, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          tests_path = Path('tool/tests/test_project_cli.py')
          tests = tests_path.read_text(encoding='utf-8')
          replacements = {
              'test_next_returns_print_configuration_task': 'test_next_returns_crop_and_fit_task',
              "self.assertEqual(task['id'], 'M2-T02')": "self.assertEqual(task['id'], 'M2-T03')",
              "self.assertIn('M2-T02', result.stdout)": "self.assertIn('M2-T03', result.stdout)",
          }
          for old, new in replacements.items():
              if old not in tests:
                  raise SystemExit(f'Missing expected CLI test text: {old}')
              tests = tests.replace(old, new)
          tests_path.write_text(tests, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_state = (
              'Photo Cut can now select and preview one real gallery image while keeping it\n'
              'local to the device and recovering Android lost-data cases. The repository\n'
              'remains in **M2 — Usable MVP flow**; the next task builds the app-owned\n'
              'configuration screen for the two-step prepare-then-print flow.\n'
          )
          new_state = (
              'Photo Cut can select a real gallery image and configure its exact size, paper,\n'
              'copies, margins, spacing and cut marks with a live app-owned preview. The\n'
              'repository remains in **M2 — Usable MVP flow**; the next task adds crop-to-fill,\n'
              'fit-inside and Photo Cut-owned colour handling before final PDF review.\n'
          )
          if old_state not in readme:
              raise SystemExit('README current-state paragraph did not match expected text')
          readme = readme.replace(old_state, new_state)
          readme = readme.replace('show M2-T02', 'show M2-T03')
          readme = readme.replace('verify M2-T02', 'verify M2-T03')
          readme_path.write_text(readme, encoding='utf-8')

          evidence_path = Path('project/evidence/M2-T02/README.md')
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text(
              '# M2-T02 evidence — Photo Cut configuration step\n\n'
              'Focused preparation run `33908511625` and complete Android/iOS PR CI run '
              '`33908672038` passed.\n\n'
              'The implementation stores exact physical values in immutable feature state, '
              'validates user input, preserves size across unit changes and drives a live '
              'sheet preview through the existing layout engine. It implements Step 1 of '
              'issue #9 and deliberately leaves crop/fit and final PDF handoff to the next '
              'roadmap tasks.\n',
              encoding='utf-8',
          )
          PY

      - name: Validate repository-owned state
        run: |
          python3 tool/project.py validate
          python3 -m unittest discover -s tool/tests -p 'test_*.py'
          python3 tool/project.py status
          python3 tool/project.py next

      - name: Commit task completion and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/complete-m2-t02.yml
          git add project/plan.json tool/tests/test_project_cli.py README.md project/evidence/M2-T02/README.md
          git commit -m 'M2-T02: complete configuration and open crop flow'
          git restore --worktree .
          git pull --rebase origin task/M2-T02-print-configuration
          git push origin HEAD:task/M2-T02-print-configuration
