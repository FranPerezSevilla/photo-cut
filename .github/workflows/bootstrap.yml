name: Bootstrap repository

on:
  push:
    branches:
      - bootstrap/m0-agent-ready

permissions:
  contents: write

concurrency:
  group: bootstrap-photo-cut
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize Flutter repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout staged bootstrap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Assemble large repository files
        run: |
          cat .bootstrap/plan-* > project/plan.json
          cat .bootstrap/projectpy-* > tool/project.py
          chmod +x tool/project.py tool/bootstrap_platforms.sh tool/normalize_platforms.py

      - name: Generate Android and iOS scaffolds
        run: bash tool/bootstrap_platforms.sh

      - name: Resolve dependencies and format Dart
        run: |
          flutter pub get
          dart format lib test

      - name: Validate repository control plane
        run: |
          python3 tool/project.py doctor --strict
          python3 tool/project.py validate
          python3 -m unittest discover -s tool/tests -p 'test_*.py'
          python3 tool/normalize_platforms.py --check

      - name: Commit materialized repository
        run: |
          rm -rf .bootstrap
          rm .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'M0-T03: materialize Flutter platform scaffolds'
          git push origin HEAD
