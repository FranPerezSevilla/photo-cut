name: Complete M1-T03

on:
  push:
    branches:
      - task/M1-T03-exact-size-pdf

permissions:
  contents: write

concurrency:
  group: complete-m1-t03
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task/M1-T03-exact-size-pdf
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate required task evidence
        run: |
          dart run tool/generate_sample_pdf.dart
          test -s build/evidence/sample-35x45-a4.pdf
          test -s build/evidence/sample-35x45-a4.geometry.json

      - name: Close M1-T03 and open M1-T04
        run: |
          python3 tool/project.py set-status M1-T03 done
          python3 tool/project.py set-status M1-T04 ready
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path('project/plan.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          tasks = {task['id']: task for task in plan['tasks']}
          task = tasks['M1-T03']
          task['completedAt'] = '2026-09-03'
          task['verification'] = [
              'GitHub Actions CI run 33797250917: Quality and Android — success',
              'GitHub Actions CI run 33797250917: iOS simulator build — success',
              'Artifact 9909790251: PDF, geometry report, APK and coverage',
              'Artifact digest sha256:2f16065be07c8d87c793baa83d1ef0f1c23cde23d6bccd922e5125e092616c44',
          ]
          evidence = task.setdefault('evidence', [])
          durable_evidence = 'project/evidence/M1-T03/README.md'
          if durable_evidence not in evidence:
              evidence.append(durable_evidence)
          plan_path.write_text(
              json.dumps(plan, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          tests_path = Path('tool/tests/test_project_cli.py')
          tests = tests_path.read_text(encoding='utf-8')
          tests = tests.replace(
              'test_next_returns_pdf_generation_task',
              'test_next_returns_pdf_preview_task',
          )
          tests = tests.replace(
              "self.assertEqual(task['id'], 'M1-T03')",
              "self.assertEqual(task['id'], 'M1-T04')",
          )
          tests = tests.replace(
              "self.assertIn('M1-T03', result.stdout)",
              "self.assertIn('M1-T04', result.stdout)",
          )
          tests_path.write_text(tests, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'The physical-unit and repeated-photo layout engines are complete. The repository\n'
              'is in **M1 — Geometry and PDF spike**; the next executable task renders the first\n'
              'deterministic exact-size PDF from that layout plan.\n',
              'Physical units, repeated-photo layout and deterministic exact-size PDF generation\n'
              'are complete. The repository is in **M1 — Geometry and PDF spike**; the next\n'
              'executable task previews that PDF and hands it to native share and print flows.\n',
          )
          readme = readme.replace('show M1-T03', 'show M1-T04')
          readme = readme.replace('verify M1-T03', 'verify M1-T04')
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          addition = '- Exact-size PDF rendering from SheetPlan with inspected A4 and photo rectangles.\n'
          if addition not in changelog:
              changelog = changelog.rstrip() + '\n' + addition
          changelog_path.write_text(changelog, encoding='utf-8')

          evidence_dir = Path('project/evidence/M1-T03')
          evidence_dir.mkdir(parents=True, exist_ok=True)
          evidence_path = evidence_dir / 'README.md'
          evidence_path.write_text(
              '# M1-T03 evidence — exact-size sample PDF\n\n'
              'The final implementation was verified by GitHub Actions CI run '
              '`33797250917`. Both the Android quality/build job and the unsigned '
              'iOS simulator build completed successfully.\n\n'
              '## Generated artifact\n\n'
              '- Artifact ID: `9909790251`\n'
              '- Digest: `sha256:2f16065be07c8d87c793baa83d1ef0f1c23cde23d6bccd922e5125e092616c44`\n'
              '- Files: `sample-35x45-a4.pdf`, geometry JSON, Android debug APK and coverage.\n\n'
              'The sample is generated from a synthetic 35 × 45 pixel PNG and contains '
              'eight rectangles whose PDF model measures 35 × 45 mm on an A4 page. '
              'Automated tests inspect the serialized page `MediaBox` and the actual PDF '
              'widget boxes with a 0.1 mm tolerance.\n\n'
              'This evidence proves PDF geometry only. It does not claim that a printer '
              'driver will preserve scale; that remains a later physical human gate.\n',
              encoding='utf-8',
          )
          PY

      - name: Validate completed repository state
        run: |
          python3 tool/project.py validate
          python3 -m unittest discover -s tool/tests -p 'test_*.py'
          python3 tool/project.py status
          python3 tool/project.py next
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
          dart run tool/generate_sample_pdf.dart
          test -s build/evidence/sample-35x45-a4.pdf
          test -s build/evidence/sample-35x45-a4.geometry.json

      - name: Commit completion state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/plan.json tool/tests/test_project_cli.py README.md CHANGELOG.md project/evidence/M1-T03/README.md
          git commit -m 'M1-T03: complete exact-size PDF and open preview spike'
          git restore --worktree .
          git pull --rebase origin task/M1-T03-exact-size-pdf
          git push origin HEAD:task/M1-T03-exact-size-pdf
