name: Prepare M2-T02

on:
  push:
    branches:
      - task/M2-T02-print-configuration

permissions:
  contents: write

concurrency:
  group: prepare-m2-t02
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task/M2-T02-print-configuration
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format task sources
        run: dart format lib test

      - name: Verify task sources
        run: |
          python3 tool/normalize_platforms.py --check
          flutter analyze --fatal-infos
          flutter test test/features/print_job test/app

      - name: Commit formatted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          if git diff --cached --quiet; then
            echo 'Sources were already formatted.'
          else
            git commit -m 'M2-T02: format configuration flow'
            git restore --worktree .
            git pull --rebase origin task/M2-T02-print-configuration
            git push origin HEAD:task/M2-T02-print-configuration
          fi
