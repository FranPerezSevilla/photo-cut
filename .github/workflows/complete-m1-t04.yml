name: Complete M1-T04

on:
  push:
    branches:
      - task/M1-T04-pdf-preview-share-spike

permissions:
  contents: write

concurrency:
  group: complete-m1-t04
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task/M1-T04-pdf-preview-share-spike
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Close M1 and open M2
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path('project/plan.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          tasks = {task['id']: task for task in plan['tasks']}

          completed = tasks['M1-T04']
          if completed['status'] not in {'ready', 'done'}:
              raise SystemExit(f"Unexpected M1-T04 state: {completed['status']}")
          completed['status'] = 'done'
          completed['completedAt'] = '2026-09-04'
          completed['evidence'] = [
              'lib/platform/print/',
              'lib/features/pdf_spike/',
              'test/platform/print_gateway_test.dart',
              'test/features/pdf_spike/pdf_spike_screen_test.dart',
              'project/decisions/ADR-006-native-pdf-preview-share-print.md',
              'project/evidence/M1-T04/README.md',
          ]
          completed['verification'] = [
              'GitHub Actions CI run 33859417443: Quality and Android — success',
              'GitHub Actions CI run 33859417443: iOS simulator build — success',
              'GitHub Actions preparation run 33859271477: analysis and 36 Flutter tests — success',
          ]

          next_task = tasks['M2-T01']
          if next_task['status'] == 'backlog':
              next_task['status'] = 'ready'
          elif next_task['status'] != 'ready':
              raise SystemExit(f"Unexpected M2-T01 state: {next_task['status']}")

          plan['currentMilestone'] = 'M2'
          plan['updatedAt'] = '2026-09-04'
          plan_path.write_text(
              json.dumps(plan, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          tests_path = Path('tool/tests/test_project_cli.py')
          tests = tests_path.read_text(encoding='utf-8')
          replacements = {
              'test_next_returns_pdf_preview_task': 'test_next_returns_image_selection_task',
              "self.assertEqual(task['id'], 'M1-T04')": "self.assertEqual(task['id'], 'M2-T01')",
              "self.assertIn('M1 — Geometry and PDF spike', result.stdout)": "self.assertIn('M2 — Usable MVP flow', result.stdout)",
              "self.assertIn('M1-T04', result.stdout)": "self.assertIn('M2-T01', result.stdout)",
          }
          for old, new in replacements.items():
              if old not in tests:
                  raise SystemExit(f'Missing expected project CLI test text: {old}')
              tests = tests.replace(old, new)
          tests_path.write_text(tests, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_state = (
              'Physical units, repeated-photo layout and deterministic exact-size PDF generation\n'
              'are complete. The repository is in **M1 — Geometry and PDF spike**; the next\n'
              'executable task previews that PDF and hands it to native share and print flows.\n'
          )
          new_state = (
              'The geometry and PDF spike is complete: exact-size PDFs can be generated,\n'
              'previewed, shared and handed to native printing. The repository is now in\n'
              '**M2 — Usable MVP flow**; the next task selects a real gallery image robustly.\n'
          )
          if old_state not in readme:
              raise SystemExit('README current-state paragraph did not match the expected M1 text')
          readme = readme.replace(old_state, new_state)
          readme = readme.replace('show M1-T04', 'show M2-T01')
          readme = readme.replace('verify M1-T04', 'verify M2-T01')
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          addition = (
              '- In-app PDF preview plus native share and print gateways for Android and iOS.\n'
          )
          if addition not in changelog:
              changelog = changelog.rstrip() + '\n' + addition
          changelog_path.write_text(changelog, encoding='utf-8')

          evidence_path = Path('project/evidence/M1-T04/README.md')
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text(
              '# M1-T04 evidence — PDF preview, share and print spike\n\n'
              'The final task implementation was verified by GitHub Actions CI run '
              '`33859417443`. The Android quality/build job and unsigned iOS simulator '
              'build both completed successfully.\n\n'
              'The spike renders the deterministic eight-copy 35 × 45 mm A4 document '
              'inside the app. User-triggered share and print actions pass the same '
              'in-memory PDF through `PrintGateway`; widget tests use a fake gateway '
              'to verify payload identity, cancellation, retry and error handling.\n\n'
              'This evidence proves integration and target-platform compilation. It '
              'does not claim that a person completed a native share or print dialog, '
              'nor that a physical printer preserved dimensions. Those remain '
              'real-device and physical-validation gates.\n',
              encoding='utf-8',
          )
          PY

      - name: Validate repository-owned state
        run: |
          python3 tool/project.py validate
          python3 -m unittest discover -s tool/tests -p 'test_*.py'
          python3 tool/project.py status
          python3 tool/project.py next
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

      - name: Commit milestone completion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/plan.json tool/tests/test_project_cli.py README.md CHANGELOG.md project/evidence/M1-T04/README.md
          git commit -m 'M1-T04: complete PDF spike and open MVP flow'
          git restore --worktree .
          git pull --rebase origin task/M1-T04-pdf-preview-share-spike
          git push origin HEAD:task/M1-T04-pdf-preview-share-spike
