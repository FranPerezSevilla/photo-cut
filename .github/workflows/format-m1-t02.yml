name: Format M1-T02

on:
  push:
    branches:
      - task/M1-T02-repeated-photo-layout

permissions:
  contents: write

concurrency:
  group: format-m1-t02
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task/M1-T02-repeated-photo-layout
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format task sources
        run: dart format lib/core/layout test/core/layout

      - name: Commit formatted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/layout test/core/layout
          if git diff --cached --quiet; then
            echo 'Files were already formatted.'
          else
            git commit -m 'M1-T02: format sheet layout sources'
            git pull --rebase origin task/M1-T02-repeated-photo-layout
            git push origin HEAD:task/M1-T02-repeated-photo-layout
          fi
