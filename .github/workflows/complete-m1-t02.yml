name: Complete M1-T02

on:
  push:
    branches:
      - task/M1-T02-repeated-photo-layout

permissions:
  contents: write

concurrency:
  group: complete-m1-t02
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task/M1-T02-repeated-photo-layout
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Close M1-T02 and open M1-T03
        run: |
          python3 tool/project.py set-status M1-T02 done
          python3 tool/project.py set-status M1-T03 ready
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path('project/plan.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          tasks = {task['id']: task for task in plan['tasks']}
          tasks['M1-T02']['completedAt'] = '2026-09-03'
          tasks['M1-T02']['verification'] = [
              'GitHub Actions CI run 33794909155: Quality and Android — success',
              'GitHub Actions CI run 33794909155: iOS simulator build — success',
          ]
          plan_path.write_text(
              json.dumps(plan, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          tests_path = Path('tool/tests/test_project_cli.py')
          tests = tests_path.read_text(encoding='utf-8')
          tests = tests.replace(
              'test_next_returns_sheet_layout_task',
              'test_next_returns_pdf_generation_task',
          )
          tests = tests.replace(
              "self.assertEqual(task['id'], 'M1-T02')",
              "self.assertEqual(task['id'], 'M1-T03')",
          )
          tests = tests.replace(
              "self.assertIn('M1-T02', result.stdout)",
              "self.assertIn('M1-T03', result.stdout)",
          )
          tests_path.write_text(tests, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'The foundation and exact physical-unit model are complete. The repository is in\n'
              '**M1 — Geometry and PDF spike**; the next executable task distributes repeated\n'
              'photo rectangles across one or more sheets.\n',
              'The physical-unit and repeated-photo layout engines are complete. The repository\n'
              'is in **M1 — Geometry and PDF spike**; the next executable task renders the first\n'
              'deterministic exact-size PDF from that layout plan.\n',
          )
          readme = readme.replace('show M1-T02', 'show M1-T03')
          readme = readme.replace('verify M1-T02', 'verify M1-T03')
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          addition = '- Deterministic repeated-photo sheet layout with orientation, margins, gaps and page overflow.\n'
          if addition not in changelog:
              changelog = changelog.rstrip() + '\n' + addition
          changelog_path.write_text(changelog, encoding='utf-8')

          architecture_path = Path('project/architecture.md')
          architecture = architecture_path.read_text(encoding='utf-8')
          old = (
              'Coordinate-system and placement conventions will be finalised in M1 and covered\n'
              'by unit tests before PDF rendering is added.\n'
          )
          new = (
              'Sheet placement uses a top-left physical origin and row-major copy order. The\n'
              'engine evaluates portrait and landscape paper plus optional 90-degree photo\n'
              'rotation. It selects greatest capacity, then preserves photo orientation, then\n'
              'prefers portrait paper as a deterministic tie-breaker. The complete grid is\n'
              'centred inside the configured minimum margin; page overflow reuses that grid.\n'
          )
          if old in architecture:
              architecture = architecture.replace(old, new)
          architecture_path.write_text(architecture, encoding='utf-8')
          PY

      - name: Validate repository-owned state
        run: |
          python3 tool/project.py validate
          python3 -m unittest discover -s tool/tests -p 'test_*.py'
          python3 tool/project.py status
          python3 tool/project.py next
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

      - name: Commit completion state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/plan.json tool/tests/test_project_cli.py README.md CHANGELOG.md project/architecture.md
          git commit -m 'M1-T02: complete layout task and open PDF generation'
          git restore --worktree .
          git pull --rebase origin task/M1-T02-repeated-photo-layout
          git push origin HEAD:task/M1-T02-repeated-photo-layout
