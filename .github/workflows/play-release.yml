name: Play Release AAB

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/play-release.yml'
  workflow_dispatch:
    inputs:
      build_name:
        description: Optional version name override, for example 0.1.0
        required: false
        type: string
      build_number:
        description: Optional monotonically increasing Play versionCode override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: play-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.2
  EXPECTED_UPLOAD_CERT_SHA256: 1B:3D:D6:00:F2:6A:E5:1F:89:5F:24:75:E5:62:63:CA:A6:C9:1A:D2:AD:0C:A7:ED:F9:E1:0A:7E:10:C1:EC:04

jobs:
  android-play-release:
    name: Signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: play-release

    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Play release builds must be dispatched from main." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bootstrap platform folders when absent
        run: bash tool/bootstrap_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify Android/iOS platform configuration
        run: python3 tool/normalize_platforms.py --check

      - name: Repository doctor
        run: python3 tool/project.py doctor --strict

      - name: Validate roadmap
        run: python3 tool/project.py validate

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Reconstruct protected upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?ANDROID_UPLOAD_KEYSTORE_BASE64 is missing}"
          : "${ANDROID_UPLOAD_STORE_PASSWORD:?ANDROID_UPLOAD_STORE_PASSWORD is missing}"
          : "${ANDROID_UPLOAD_KEY_PASSWORD:?ANDROID_UPLOAD_KEY_PASSWORD is missing}"
          : "${ANDROID_UPLOAD_KEY_ALIAS:?ANDROID_UPLOAD_KEY_ALIAS is missing}"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = ''.join(os.environ['KEYSTORE_BASE64'].split())
          keystore = base64.b64decode(encoded, validate=True)
          if len(keystore) < 1000:
              raise SystemExit('Decoded Android upload keystore is unexpectedly small.')

          path = Path('android/app/upload-keystore.jks')
          path.write_bytes(keystore)
          path.chmod(0o600)
          PY

      - name: Verify protected upload certificate
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(
            keytool -exportcert -rfc               -keystore android/app/upload-keystore.jks               -storepass:env ANDROID_UPLOAD_STORE_PASSWORD               -alias "${ANDROID_UPLOAD_KEY_ALIAS}" |
            openssl x509 -noout -fingerprint -sha256 |
            cut -d= -f2
          )"
          if [[ "${actual}" != "${EXPECTED_UPLOAD_CERT_SHA256}" ]]; then
            echo "Upload certificate fingerprint mismatch." >&2
            echo "Expected: ${EXPECTED_UPLOAD_CERT_SHA256}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi
          echo "Upload certificate fingerprint verified."

      - name: Build signed Android App Bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--release)
          if [[ -n "${BUILD_NAME}" ]]; then
            args+=("--build-name=${BUILD_NAME}")
          fi
          if [[ -n "${BUILD_NUMBER}" ]]; then
            if [[ ! "${BUILD_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "build_number must contain digits only." >&2
              exit 1
            fi
            args+=("--build-number=${BUILD_NUMBER}")
          fi
          flutter build appbundle "${args[@]}"

      - name: Verify generated bundle signature
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/app/outputs/bundle/release/app-release.aab"
          jarsigner -verify "${bundle}"
          actual="$(
            keytool -printcert -jarfile "${bundle}" |
            awk -F': ' '/SHA256:/{print $2; exit}'
          )"
          if [[ "${actual}" != "${EXPECTED_UPLOAD_CERT_SHA256}" ]]; then
            echo "Generated AAB signer fingerprint mismatch." >&2
            echo "Expected: ${EXPECTED_UPLOAD_CERT_SHA256}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi
          echo "Generated AAB signature verified."

      - name: Stage Play Console artifact
        id: release_meta
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          pubspec = Path('pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*([^+\s]+)\+(\d+)\s*$', pubspec, re.MULTILINE)
          if not match:
              raise SystemExit('Could not read version from pubspec.yaml.')

          version_name = os.environ.get('BUILD_NAME') or match.group(1)
          build_number = os.environ.get('BUILD_NUMBER') or match.group(2)
          filename = f'PhotoCut-{version_name}-build{build_number}-GooglePlay.aab'

          source = Path('build/app/outputs/bundle/release/app-release.aab')
          target_dir = Path('build/play-release')
          target_dir.mkdir(parents=True, exist_ok=True)
          target = target_dir / filename
          shutil.copy2(source, target)

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'filename={filename}\n')
              output.write(f'version_name={version_name}\n')
              output.write(f'build_number={build_number}\n')
          PY

      - name: Upload signed Play Console AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release_meta.outputs.filename }}
          path: build/play-release/${{ steps.release_meta.outputs.filename }}
          if-no-files-found: error
          retention-days: 30
