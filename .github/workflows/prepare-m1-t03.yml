name: Prepare M1-T03

on:
  push:
    branches:
      - task/M1-T03-exact-size-pdf

permissions:
  contents: write

concurrency:
  group: prepare-m1-t03
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: task/M1-T03-exact-size-pdf
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve and lock dependencies
        run: flutter pub get

      - name: Format PDF sources and generator
        run: dart format lib/platform/pdf test/platform/pdf tool/generate_sample_pdf.dart

      - name: Verify PDF task before committing generated state
        run: |
          flutter analyze --fatal-infos
          flutter test test/platform/pdf
          dart run tool/generate_sample_pdf.dart

      - name: Commit lockfile and formatted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock lib/platform/pdf test/platform/pdf tool/generate_sample_pdf.dart
          if git diff --cached --quiet; then
            echo 'Lockfile and sources were already prepared.'
          else
            git commit -m 'M1-T03: lock pdf dependency and format renderer'
            git restore --worktree .
            git pull --rebase origin task/M1-T03-exact-size-pdf
            git push origin HEAD:task/M1-T03-exact-size-pdf
          fi
